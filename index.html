<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Grid Game</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div id="input-section">
        <h2 id="game-title">Button Grid Game</h2>
        <label for="button-count" id="button-count-label">How many buttons to create?</label>
        <input type="number" id="button-count" min="3" max="7" value="3">
        <button id="go-button">Create Buttons</button>
    </div>
    
    <div id="game-area"></div>
    
    <script src="./lang/messages/en/user.js"></script>
    <script src="./js/board.js"></script>
    <script src="./js/button.js"></script>
    <script src="./js/game.js"></script>
    <script src="./js/script.js"></script>
</body>
</html>
